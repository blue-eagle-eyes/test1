<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-container">
    <form id="loginForm" class="login-form" novalidate>
      <h1>Sign In</h1>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
        <span class="error-message" id="usernameError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" autocomplete="current-password" required minlength="8">
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">👁</button>
        </div>
        <span class="error-message" id="passwordError"></span>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Log In</button>

      <p id="formMessage" class="form-message" role="alert"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
